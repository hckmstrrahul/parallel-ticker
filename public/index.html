<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece8"><meta name="description" content="A minimal stock signal explorer, grounded in web evidence by the free Parallel Decisions API.">
  <title>parallel-ticker — Parallel Decisions demo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css?v=20261029-12"><script type="module" src="/app.js?v=20261029-12"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="parallel-ticker home"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 16h5l4-10 6 17 4-12h5"/></svg><span>parallel-ticker<span class="brand-period">.</span></span></a>
    <div class="header-right"><a class="text-button repo-link" href="https://github.com/hckmstrrahul/parallel-ticker" target="_blank" rel="noopener noreferrer" aria-label="parallel-ticker on GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.922c.563.104.769-.244.769-.542 0-.267-.01-.975-.015-1.913-3.13.68-3.79-1.509-3.79-1.509-.512-1.3-1.25-1.646-1.25-1.646-1.023-.7.078-.686.078-.686 1.13.08 1.725 1.16 1.725 1.16 1.006 1.724 2.64 1.226 3.283.938.102-.729.394-1.226.716-1.508-2.499-.284-5.126-1.25-5.126-5.565 0-1.23.44-2.234 1.16-3.022-.116-.284-.503-1.43.11-2.98 0 0 .945-.303 3.095 1.155a10.8 10.8 0 0 1 5.631 0c2.149-1.458 3.092-1.155 3.092-1.155.615 1.55.228 2.696.112 2.98.722.788 1.159 1.792 1.159 3.022 0 4.326-2.632 5.278-5.139 5.557.404.35.764 1.043.764 2.1 0 1.517-.014 2.74-.014 3.112 0 .3.203.65.774.54A11.25 11.25 0 0 0 12 .75Z"/></svg><span>GitHub</span></a></div>
  </header>
  <main>
    <section class="intro" aria-labelledby="title"><div class="eyebrow"><span class="parallel-mark" aria-hidden="true"></span> PARALLEL.AI DECISIONS API DEMO</div><h1 id="title">Read the <span>signal.</span></h1></section>
    <section class="search-section" aria-label="Analyze a stock">
      <form id="stock-form" class="search-panel"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><label class="sr-only" for="stock">Stock name or ticker</label><input id="stock" name="stock" type="text" placeholder="Enter a stock name or ticker" maxlength="100" autocomplete="off" required><label class="sr-only" for="market">Market</label><select id="market" name="market"><option value="NSE">NSE · India</option><option value="US">US markets</option></select><button class="analyze-button" id="analyze" type="submit">ANALYZE</button><button class="cancel-button" id="cancel" type="button" hidden>Cancel</button></form>
      <div class="search-under"><div id="examples" class="stock-shortcuts" aria-label="Stock shortcuts"></div></div>
      <div id="error" class="error-panel" role="alert" hidden></div>
      <p id="progress" class="progress-text" role="status" aria-live="polite"></p>
    </section>
    <div class="workspace">
      <div class="analysis-column">
        <div class="section-heading"><span class="eyebrow">SNAPSHOT</span><span id="snapshot-meta" class="meta"></span></div>
        <p id="freshness-note" class="freshness-note" hidden></p>
        <section class="overview" id="overview" aria-label="Decision snapshot"></section>
        <div class="section-heading signals-heading"><span class="eyebrow">SIGNALS</span><span id="signal-count" class="meta"></span></div>
        <section class="signals-grid" id="signals" aria-label="Technical signals"></section>
      </div>
      <aside id="evidence-section" class="evidence-section" aria-labelledby="evidence-heading">
        <div class="section-heading"><h2 id="evidence-heading" class="eyebrow">EVIDENCE</h2><span id="source-count" class="meta"></span></div>
        <div class="sources-panel" tabindex="0" role="region" aria-label="Scrollable evidence"><div id="sources"><p class="evidence-empty">Sources will appear here.</p></div></div>
      </aside>
    </div>
  </main>
</body>
</html>
